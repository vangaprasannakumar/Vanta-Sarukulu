<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vanta Sarukulu</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#287a28">

    <link rel="icon" type="image/png" href="https://i.postimg.cc/kXGhXSwf/Vanga_Satyanarayana_వ_ట_మ_స_త_ర_LOGO_1_1.png">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/kXGhXSwf/Vanga_Satyanarayana_వ_ట_మ_స_త_ర_LOGO_1_1.png">
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap" rel="stylesheet">

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; 
            background-color: #f0f4f8; 
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- BEAUTIFUL SPLASH SCREEN --- */
        #splash-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            background: linear-gradient(135deg, #f7f9f6, #e2e8f0);
            position: absolute;
            top: 0;
            left: 0;
            z-index: 9999;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        .splash-logo {
            width: 140px;
            height: auto;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            margin-bottom: 30px;
            animation: float 3s ease-in-out infinite;
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 5px solid rgba(22, 163, 74, 0.2); 
            border-top: 5px solid #16a34a; 
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        .status-text {
            color: #334155;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            padding: 0 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        /* --- IFRAME (The App) --- */
        iframe {
            width: 100vw;
            height: 100vh;
            border: none;
            display: none; 
            opacity: 0;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>
    
    <div id="splash-screen">
        <img src="https://i.postimg.cc/kXGhXSwf/Vanga_Satyanarayana_వ_ట_మ_స_త_ర_LOGO_1_1.png" alt="Vanga Satyanarayana" class="splash-logo">
        <div class="spinner"></div>
        <div class="status-text" id="status-message">Starting Vantamesthri...</div>
    </div>
    
    <iframe id="appFrame" src="" allow="geolocation"></iframe>

    <script>
        // --- YOUR GOOGLE APPS SCRIPT URL ---
        const appsScriptUrl = "https://script.google.com/macros/s/AKfycbyFOXbDaYUYCnRqNM-CUOqD90FmVfr5jj8-BQwMMAzwBZuphnmX5lHRe1Dj-G3CpUaf/exec";

        const splashScreen = document.getElementById('splash-screen');
        const appFrame = document.getElementById('appFrame');
        const statusMessage = document.getElementById('status-message');

        function revealApp() {
            setTimeout(() => {
                splashScreen.style.opacity = '0';
                appFrame.style.display = 'block';
                void appFrame.offsetWidth;
                appFrame.style.opacity = '1';
                setTimeout(() => {
                    splashScreen.style.visibility = 'hidden';
                }, 600);
            }, 800);
        }

        function loadApp() {
            statusMessage.innerText = "Loading data...";
            appFrame.src = appsScriptUrl;
            appFrame.onload = function() {
                revealApp();
            };
            setTimeout(revealApp, 4000); 
        }

        statusMessage.innerText = "Checking location...";
        
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                function(position) { loadApp(); },
                function(error) { loadApp(); },
                { timeout: 4000 }
            );
        } else {
            loadApp();
        }
    </script>
</body>
</html>
